; ========================================================
; Tidebar 桌面整机 HUD 配置文件
; 提示：修改此文件后，可在右键菜单中点击「重新加载配置」生效
; ========================================================

[modules]
; 模块开关：on (开启), off (关闭), auto (自动探测，硬件/环境支持时启用)
cpu=on
memory=on
gpu=auto
network=on
latency=on
syncthing=auto
claude=auto
system=on

[latency]
; 延迟测试目标 URL（默认使用 Cloudflare 204）
url=http://cp.cloudflare.com/generate_204
; 代理设置：system (跟随系统代理), none (直接连接), 或指定代理地址如 http://127.0.0.1:7890
proxy=system
; 界面显示的延迟标签文本
label=网络延迟

[syncthing]
; 监控目录：auto (自动匹配第一个同步文件夹)，或指定具体 folder 的 id 或 label
folder=auto

[window]
; 窗口固定坐标 X 与 Y，留空则默认定位在主屏幕右上角
left=
top=
; 窗口深色玻璃透明度：0.2 ~ 0.95（默认推荐 0.72）
opacity=0.72
; 窗口置顶：on / off
topmost=on
; 鼠标悬停自动展开/移开自动折叠：on / off
hover_expand=on
