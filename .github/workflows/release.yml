name: build-and-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (system csc.exe, no SDK)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File windows/build.ps1
      - name: Package
        shell: powershell
        run: Compress-Archive -Path windows/dist/Tidebar.exe, windows/config.example.ini -DestinationPath Tidebar-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Tidebar-windows.zip

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: cd mac && chmod +x build.sh && ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/dist/Tidebar-mac.zip

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
